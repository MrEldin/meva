<!DOCTYPE html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f2efe8;
         font-family: Manrope, sans-serif; color: #24342c; -webkit-font-smoothing: antialiased }
  .card { display: flex; width: 1200px; height: 630px }

  .left { width: 596px; padding: 56px 48px 48px 64px; display: flex; flex-direction: column; justify-content: space-between }
  .logo { height: 58px; width: auto }
  .kicker { font-family: 'DM Mono', monospace; font-size: 15px; letter-spacing: 0.22em;
            text-transform: uppercase; color: #c56d59; margin-top: 40px }
  h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 60px; line-height: 1.02;
       letter-spacing: -0.02em; margin-top: 18px }
  h1 em { font-style: italic; color: #b3617e }
  .proof { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px }
  .chip { border-radius: 999px; padding: 9px 18px; font-size: 17px; font-weight: 600; line-height: 1 }
  .chip.sage { background: #d9e4c6; color: #3d5442 }
  .chip.line { border: 1.5px solid rgba(36,52,44,.22); color: #3f5248 }
  .foot { display: flex; align-items: baseline; gap: 14px; font-family: 'DM Mono', monospace;
          font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(36,52,44,.55) }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: #b3617e; display: inline-block }

  .right { width: 604px; position: relative; overflow: hidden; background: #e7e6e4 }
  .right img { position: absolute; top: 50%; left: 50%; width: 110%; height: auto; transform: translate(-50%, -50%) }
  /* The photograph is cool grey; a soft wash joins it to the cream panel. */
  .seam { position: absolute; inset: 0 auto 0 0; width: 130px;
          background: linear-gradient(90deg, #f2efe8, rgba(242,239,232,0)) }
</style>
<div class="card">
  <div class="left">
    <div>
      <img class="logo" src="logo.png" alt="Meva Cosmetics">
      <p class="kicker">Novi Pazar · od 2010.</p>
      <h1>Prirodna nega<br>kože i <em>kose</em>.</h1>
      <div class="proof">
        <span class="chip sage">5.479 porudžbina</span>
        <span class="chip line">Ručno rađeno</span>
        <span class="chip line">Bez sulfata</span>
      </div>
    </div>
    <p class="foot"><span class="dot"></span> Besplatna dostava &nbsp;·&nbsp; Plaćanje pouzećem</p>
  </div>
  <div class="right">
    <img src="set.jpg" alt="">
    <div class="seam"></div>
  </div>
</div>
